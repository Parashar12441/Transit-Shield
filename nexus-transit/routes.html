<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>NEXUS TRANSIT</title><link rel=stylesheet href=style.css><link rel=stylesheet href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script></head><body><div id=root></div><script src=app.js></script><script>
N.shell('routes','Route Intelligence');
app.innerHTML='<div class=g2><div class=card><h3>Routes &amp; stops</h3><div id=m class=map></div></div><div class=card><h3>Safety rules (simulated config)</h3><div id=rt></div></div></div>';
N.map('m');
rt.innerHTML=N.routes.map(r=>{const n=N.inc.filter(i=>N.buses.find(b=>b.id==i.bus&&b.route==r)).length;return'<div class=row style="display:block;cursor:default;margin-bottom:8px"><b style="color:'+r.c+'">'+r.id+'</b> '+r.name+'<table><tr><td>Stops</td><td>'+r.pts.length+'</td></tr><tr><td>Overspeed limit</td><td><input type=number value='+r.lim+' style="width:70px" onchange="this.value=Math.max(10,Math.min(100,this.value))"> km/h</td></tr><tr><td>Deviation corridor</td><td>150 m for 30 s</td></tr><tr><td>Unplanned stop</td><td>&gt; 3 min outside stops</td></tr><tr><td>Incidents (demo)</td><td>'+n+'</td></tr></table></div>'}).join('')+'<small style=color:var(--mu)>Edits are local and not persisted; thresholds must be calibrated on real GPS traces.</small>';
</script></body></html>
