<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>NEXUS TRANSIT</title><link rel=stylesheet href=style.css><link rel=stylesheet href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script></head><body><div id=root></div><script src=app.js></script><script>
N.shell('drivers','Drivers &amp; Vehicles');
let A;try{A=JSON.parse(localStorage.getItem('nx_asg'))}catch(e){}
if(!A)A=Object.fromEntries(N.buses.map((b,i)=>[b.id,i==11?'':b.driver]));
const spare=['D. Joshi','L. Chandra'],all=[...N.buses.map(b=>b.driver).filter((d,i)=>i<11),...spare],ids=Object.fromEntries(all.map((d,i)=>[d,'DRV-'+String(i+1).padStart(2,'0')]));
const sv=()=>{try{localStorage.setItem('nx_asg',JSON.stringify(A))}catch(e){}};
app.innerHTML='<div class=card><h3>Assign driver to vehicle</h3><div class=bar><select id=sd></select><select id=sb></select><button class="btn p" id=go>Assign</button><span id=msg></span></div></div><div class=card><div class=bar style="margin-bottom:10px"><input id=q placeholder="Search vehicles or drivers" style="flex:1"></div><h3>Vehicles</h3><table id=vt></table></div><div class=card><h3>Drivers</h3><table id=dt></table></div>';
const q=()=>document.getElementById('q').value.toLowerCase();
function r(){const used=Object.values(A).filter(Boolean);sd.innerHTML='<option value="">Select free driver</option>'+all.filter(d=>!used.includes(d)).map(d=>'<option>'+d+'</option>').join('');sb.innerHTML='<option value="">Select vehicle without driver</option>'+N.buses.filter(b=>!A[b.id]).map(b=>'<option>'+b.id+'</option>').join('');
vt.innerHTML='<tr><th>Fleet ID<th>Registration<th>Route<th>Driver<th>Tracking<th>Last update<th>Maintenance<th></tr>'+N.buses.map((b,i)=>({b,i})).filter(({b})=>(b.id+b.reg+(A[b.id]||'')).toLowerCase().includes(q())).map(({b,i})=>'<tr><td>'+b.id+'<td>'+b.reg+'<td>'+b.route.id+'<td>'+(A[b.id]||'<span style=color:var(--wa)>Unassigned</span>')+'<td><span class="dot '+N.status(b)+'" style=display:inline-block></span> '+N.status(b)+'<td>'+N.ago(b.seen)+'<td>'+(i%5==3?'Due (demo)':'OK (demo)')+'<td>'+(A[b.id]?'<button class=btn onclick="un(\''+b.id+'\')">Unassign</button>':'')+'</tr>').join('');
dt.innerHTML='<tr><th>Driver ID<th>Name<th>Vehicle<th>Availability<th>Device<th>Last heartbeat<th>App</tr>'+all.filter(d=>d.toLowerCase().includes(q())||q()=='').map((d,i)=>{const b=N.buses.find(x=>A[x.id]==d);return'<tr><td>'+ids[d]+'<td>'+d+'<td>'+(b?b.id:'—')+'<td>'+(b?'On duty':'Available')+'<td>'+(b?(N.status(b)=='STALE'?'Stale':'Online'):'Offline')+'<td>'+(b?N.ago(b.seen):'—')+'<td class=mono>2.4.'+(i%3)+'</tr>'}).join('')}
window.un=id=>{if(confirm('Unassign driver from '+id+'?')){A[id]='';sv();r()}};
go.onclick=()=>{if(!sd.value||!sb.value){msg.style.color='var(--cr)';msg.textContent='Choose both a driver and a vehicle.';return}if(!confirm('Assign '+sd.value+' to '+sb.value+'?'))return;A[sb.value]=sd.value;sv();msg.style.color='var(--ok)';msg.textContent='Assigned (demo, saved locally).';r()};
document.getElementById('q').oninput=r;r();
</script></body></html>
