<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>NEXUS TRANSIT</title><link rel=stylesheet href=style.css><link rel=stylesheet href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script></head><body><div id=root></div><script src=app.js></script><script>
N.shell('incidents','Incident Command');let sel=location.hash.slice(1)||N.inc[0].id,fs='ALL';
window.addEventListener('hashchange',()=>{sel=location.hash.slice(1);r()});
app.innerHTML='<div class=eq><div class=card><div class=bar style="margin-bottom:10px"><select id=fs><option>ALL</option><option>ACTIVE</option><option>CRITICAL</option></select><button class="btn p" onclick="N.sos();sel=N.inc[0].id;r()">Simulate SOS</button><button class=btn onclick="N.reset()">Reset demo</button></div><div class=list id=l style="max-height:640px"></div></div><div class=card id=d></div></div>';
document.getElementById('fs').onchange=e=>{fs=e.target.value;r()};
window.act=(k,v)=>{N[k](sel,v);r()};
function r(){const L_=N.inc.filter(i=>fs=='ALL'||(fs=='ACTIVE'?N.active().includes(i):i.sev=='CRITICAL'));l.innerHTML=L_.map(i=>'<div class="row '+(i.id==sel?'sel':'')+'" onclick="sel=\''+i.id+'\';r()"><span class="badge '+i.sev+'">'+i.sev+'</span><div class=gr><b>'+i.type+'</b><small>'+i.id+' · '+i.bus+' · '+N.ago(i.at)+'</small></div><small>'+i.status+'</small></div>').join('');
const i=N.inc.find(x=>x.id==sel)||N.inc[0],n=N.next[i.status],b=N.buses.find(x=>x.id==i.bus),p=b?N.pos(b):[0,0];
d.innerHTML='<h3>'+i.id+' · '+i.status+'</h3><b style="font-size:17px">'+i.type+'</b> <span class="badge '+i.sev+'">'+i.sev+'</span><p style="color:var(--mu)">Bus '+i.bus+(b?' · '+b.driver+' · '+b.route.name:'')+'<br>Assigned: '+(i.op||'Unassigned')+'<br>Last location <span class=mono>'+p[0].toFixed(4)+', '+p[1].toFixed(4)+'</span> (updated '+(b?N.ago(b.seen):'n/a')+')<br>Notifications: simulated only – no SMS/voice/112 integration</p><div class=bar>'+(n?'<button class="btn p" onclick="act(\'advance\')">'+n[1]+'</button>':'')+(n?'<button class="btn d" onclick="act(\'escalate\')">Escalate</button>':'')+'</div><div class=bar style="margin:12px 0"><input id=nt placeholder="Add incident note" style="flex:1"><button class=btn onclick="act(\'note\',nt.value)">Add</button></div><h3>Timeline</h3><div class=tl>'+i.ev.slice().reverse().map(e=>'<div>'+e.x+'<small class=mono>'+new Date(e.t).toLocaleTimeString('en-IN')+'</small></div>').join('')+'</div>'}
r();
</script></body></html>
